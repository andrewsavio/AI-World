# ─────────────────────────────────────────────────────────────
#  Netlify configuration for AI World
#  The entire front end is a single self-contained index.html.
#  three.js is loaded from a CDN, so no build step is needed.
# ─────────────────────────────────────────────────────────────

[build]
  publish = "."          # serve from the repo root

# No build command — index.html is already the final artifact.

# ── Security & performance headers ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Cache-Control          = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── SPA fallback (all paths → index.html) ────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
