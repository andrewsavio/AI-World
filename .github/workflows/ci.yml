name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch>=2.5 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest

      - name: Run test suite (pytest)
        run: |
          pytest tests/ -v

      - name: Run standalone engine self-test
        run: |
          python brain.py
